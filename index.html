<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main navbar: -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"
          ><i class="fa-brands fa-instagram"></i> Instagram</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <!-- Button trigger modal -->
              <button
                type="button"
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                Creata a new post
              </button>

              <!-- Modal -->
              <div
                class="modal fade"
                id="exampleModal"
                tabindex="-1"
                aria-labelledby="exampleModalLabel"
                aria-hidden="true"
              >
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h1 class="modal-title fs-5" id="exampleModalLabel">
                        Create a new post
                      </h1>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                      ></button>
                    </div>
                    <div class="modal-body">
                      <!-- Modal contant here: -->
                      <div class="form-floating">
                        <textarea
                          class="form-control"
                          placeholder="Leave a comment here"
                          id="floatingTextarea"
                        ></textarea>
                        <label for="floatingTextarea"
                          >Add the caption of your post here</label
                        >
                      </div>
                      <!-- Buttons under caption text area in modal -->
                      <div
                        class="btn-group"
                        role="group"
                        aria-label="Basic example"
                      >
                        <button
                          type="button"
                          class="btn btn-outline-secondary bg-danger-subtle"
                        >
                          <i class="fa-solid fa-camera"></i>
                        </button>
                        <button
                          type="button"
                          class="btn btn-outline-secondary bg-danger-subtle"
                        >
                          <i class="fa-solid fa-location-dot"></i>
                        </button>
                      </div>
                      <!-- Modal footer: -->
                    </div>
                    <div class="modal-footer">
                      <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                      >
                        Close
                      </button>
                      <button type="button" class="btn btn-success">
                        Publish
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </li>

            <!-- Navbar dropdown: -->
            <!-- Example single danger button -->
            <div class="btn-group">
              <button
                type="button"
                class="btn btn-secondary dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <i class="fa-solid fa-gear  text-light"></i>
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Profile</a></li>
                <li><a class="dropdown-item" href="#">Accesibility</a></li>
                <li>
                  <a class="dropdown-item" href="#">Privacy and Data</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item text-danger" href="#">Log out</a></li>
              </ul>
            </div>
            <!-- End navbar dropdown -->
          </ul>
        </div>
      </div>
    </nav>

    <!-- "Navigation" to select (1) Image grid or (2) Photo feed -->
    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button
          class="nav-link active"
          id="pills-home-tab"
          data-bs-toggle="pill"
          data-bs-target="#pills-home"
          type="button"
          role="tab"
          aria-controls="pills-home"
          aria-selected="true"
        >
          Home
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          id="pills-profile-tab"
          data-bs-toggle="pill"
          data-bs-target="#pills-profile"
          type="button"
          role="tab"
          aria-controls="pills-profile"
          aria-selected="false"
        >
          Profile
        </button>
      </li>
    </ul>
    <div class="tab-content" id="pills-tabContent">
      <div
        class="tab-pane fade show active"
        id="pills-home"
        role="tabpanel"
        aria-labelledby="pills-home-tab"
        tabindex="0"
      >
        <!-- Content for Home page here: -->
        <div class="container text-center">
          <div class="row">
            <div
              class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 col-xxl-3 mb-2"
            >
              <img src="https://picsum.photos/id/237/300/250" alt="" />
            </div>
            <div
              class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 col-xxl-3 mb-2"
            >
              <img src="https://picsum.photos/id/16/300/250" alt="" />
            </div>
            <div
              class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 col-xxl-3 mb-2"
            >
              <img src="https://picsum.photos/id/22/300/250" alt="" />
            </div>
            <div
              class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 col-xxl-3 mb-2"
            >
              <img src="https://picsum.photos/id/8/300/250" alt="" />
            </div>
            <div
              class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 col-xxl-3 mb-2"
            >
              <img src="https://picsum.photos/id/99/300/250" alt="" />
            </div>
            <div
              class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 col-xxl-3 mb-2"
            >
              <img src="https://picsum.photos/id/50/300/250" alt="" />
            </div>
          </div>
        </div>
      </div>
      <div
        class="tab-pane fade"
        id="pills-profile"
        role="tabpanel"
        aria-labelledby="pills-profile-tab"
        tabindex="0"
      >
        <!-- Content for Profile page here: -->
      </div>
    </div>

    <!-- No code below this line -->
    <script
      src="https://kit.fontawesome.com/0b77e7860d.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
